<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hẹn giờ</title>
  <style>
    :root { --ink:#eef2ff; --muted:#a7b0ca; --card:rgba(19,26,52,.72); --line:rgba(255,255,255,.12); --accent:#8b5cf6; --accent2:#ec4899; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:#090d20; }
    body::before, body::after { content:""; position:fixed; width:48vmax; height:48vmax; border-radius:50%; filter:blur(60px); opacity:.25; pointer-events:none; }
    body::before { background:#5b21b6; left:-20vmax; top:-16vmax; } body::after { background:#db2777; right:-22vmax; bottom:-20vmax; }
    .app { width:min(92vw,480px); padding:30px; text-align:center; border:1px solid var(--line); border-radius:30px; background:var(--card); box-shadow:0 25px 80px rgba(0,0,0,.38); backdrop-filter:blur(18px); }
    .eyebrow { margin:0 0 8px; color:#c4b5fd; font-size:.72rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0 0 26px; font-size:1.55rem; }
    .ring { --progress:0deg; position:relative; width:min(68vw,300px); aspect-ratio:1; margin:auto; padding:12px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(from -90deg,var(--accent) 0deg,var(--accent2) var(--progress),rgba(255,255,255,.08) var(--progress)); transition:background .2s linear; }
    .ring::before { content:""; position:absolute; z-index:0; width:calc(min(68vw,300px) - 24px); aspect-ratio:1; border-radius:50%; background:#111733; box-shadow:inset 0 0 28px rgba(0,0,0,.32); }
    .time { position:relative; z-index:1; font-variant-numeric:tabular-nums; font-size:clamp(3rem,12vw,5.2rem); font-weight:750; letter-spacing:-.07em; }
    .status { position:relative; z-index:1; margin-top:-26px; color:var(--muted); font-size:.86rem; }
    .presets { display:flex; justify-content:center; gap:8px; margin:27px 0 17px; flex-wrap:wrap; }
    button { border:0; color:var(--ink); font:inherit; font-weight:700; cursor:pointer; transition:transform .15s,background .15s,opacity .15s; }
    button:hover { transform:translateY(-2px); } button:active { transform:translateY(0); }
    .preset { padding:8px 13px; border-radius:999px; background:rgba(255,255,255,.09); color:#d8ddf0; font-size:.82rem; }
    .preset.active { background:rgba(139,92,246,.42); color:white; }
    .custom { display:flex; gap:9px; align-items:center; justify-content:center; margin-bottom:22px; color:var(--muted); font-size:.9rem; }
    input { width:76px; padding:10px 7px; border:1px solid var(--line); border-radius:10px; outline:none; background:rgba(0,0,0,.18); color:white; text-align:center; font:inherit; font-weight:700; }
    input:focus { border-color:#a78bfa; }
    .controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .primary { padding:14px; border-radius:14px; background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 8px 24px rgba(139,92,246,.3); }
    .secondary { padding:14px; border-radius:14px; background:rgba(255,255,255,.1); }
    .done { animation:pulse .85s ease-in-out infinite alternate; }
    @keyframes pulse { to { box-shadow:0 0 0 14px rgba(236,72,153,0),0 0 38px #ec4899; } }
    @media (max-width:370px) { .app { padding:24px 18px; } }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">Focus time</p>
    <h1>Hẹn giờ của bạn</h1>
    <section class="ring" id="ring" aria-label="Thời gian còn lại">
      <div class="time" id="display">05:00</div>
      <div class="status" id="status">Sẵn sàng bắt đầu</div>
    </section>
    <div class="presets" aria-label="Chọn thời lượng nhanh">
      <button class="preset" data-minutes="1">1 phút</button><button class="preset active" data-minutes="5">5 phút</button><button class="preset" data-minutes="15">15 phút</button><button class="preset" data-minutes="25">25 phút</button>
    </div>
    <label class="custom">Hoặc nhập số phút <input id="minutes" type="number" min="1" max="999" value="5" inputmode="numeric" /></label>
    <div class="controls">
      <button class="primary" id="start">Bắt đầu</button><button class="secondary" id="reset">Đặt lại</button>
    </div>
  </main>
  <script>
    const display=document.querySelector('#display'), status=document.querySelector('#status'), ring=document.querySelector('#ring');
    const input=document.querySelector('#minutes'), start=document.querySelector('#start'), reset=document.querySelector('#reset');
    let duration=300, remaining=300, timer=null, endAt=null;
    const format=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    function render(){ display.textContent=format(remaining); ring.style.setProperty('--progress',`${(1-remaining/duration)*360}deg`); document.title=`${format(remaining)} · Hẹn giờ`; }
    function setDuration(seconds){ clearInterval(timer); timer=null; duration=remaining=seconds; input.value=Math.round(seconds/60); start.textContent='Bắt đầu'; status.textContent='Sẵn sàng bắt đầu'; ring.classList.remove('done'); document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',+b.dataset.minutes===+input.value)); render(); }
    function alarm(){ try { const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(), g=a.createGain(); o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.1,a.currentTime);o.start();o.stop(a.currentTime+.45); } catch(e){} }
    function finish(){ clearInterval(timer); timer=null; remaining=0; render(); start.textContent='Bắt đầu'; status.textContent='Hết giờ!'; ring.classList.add('done'); alarm(); if(navigator.vibrate) navigator.vibrate([180,80,180]); }
    start.addEventListener('click',()=>{ if(timer){ clearInterval(timer);timer=null;start.textContent='Tiếp tục';status.textContent='Đã tạm dừng';return; } if(remaining===0) setDuration(Math.max(1,+input.value||5)*60); endAt=Date.now()+remaining*1000; start.textContent='Tạm dừng';status.textContent='Đang đếm ngược'; timer=setInterval(()=>{ remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000)); render(); if(!remaining) finish(); },200); });
    reset.addEventListener('click',()=>setDuration(Math.max(1,+input.value||5)*60));
    input.addEventListener('change',()=>setDuration(Math.max(1,Math.min(999,+input.value||5))*60));
    document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>setDuration(+b.dataset.minutes*60)));
    render();
  </script>
</body>
</html>
